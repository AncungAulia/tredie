[package]
name = "tredie"
version = "0.1.0"
description = "Tredie — on-chain attention market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tredie"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# suppress macro-generated cfg warnings without blunt allow-all
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.9.1"
solana-sdk = "^3"

[lints]
workspace = true
